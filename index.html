<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width = device-width, initial-scale=1.0" >
        <title>Password - generator</title>
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <main>
            <section>
                <div id="show-error-el">

                </div>
            </section>
            <section id="top-section">
                <div id="password-box">
                    <textarea readonly  id="password-show-el"></textarea>
                </div>
                <div id="buttons-div">
                    <button type="button" id="generate-el" class="actionBtn">Generate</button>
                    <button type="button" id="copy-el" class="actionBtn">Copy</button>
                </div>
            </section>
            <section id="spec-section">
                <div id="strength-div">
                    <label for="strength-el" id="password-str-el">Password Strength : <span id="strength-el"></span></label>
                </div>
                <div id="length-div">
                    <label for="length-el">Password Length : </label>
                    <input type="number" id="length-el" min="1" max="20"/>
                </div>

                <div id="char-use" >
                    <label >Character Used : </label>

                    <input type="checkbox" class="checkel" id="uppercase-el">
                    <label for="uppercase-el" >Uppercase</label>

                    <input type="checkbox" class="checkel" id="lowercase-el">
                    <label for="lowercase-el" >Lowercase</label>

                    <input type="checkbox" class="checkel" id="numbers-el">
                    <label for="numbers-el" >Numbers</label>

                    <input type="checkbox" class="checkel" id="symbol-el">
                    <label for="symbol-el" >Symbols</label>
                </div>
            </section>
        </main>
        <script src="index.js"></script>
    </body>
</html>
